<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #1e0852;
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: #1e0852;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 500px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        section {
            padding-bottom: 20px;
        }

        h2 {
            text-align: center;
            color: #1e0852;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #5948be;
            border-radius: 4px;
        }

        button {
            background-color: #5948be;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
        }

        .forgot a {
            color: #1e0852;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>LOGIN PAGE</h1>

        <nav>
            <a href="index.html"
               style="color: #636da1; margin-right: 15px;">
                Home
            </a>

            <a href="cv.html"
               style="color: #636da1;">
                CV
            </a>
        </nav>
    </header>

    <main>

        <section>

            <h2>Login</h2>

            <form
                action="#"
                method="post"
                onsubmit="event.preventDefault(); alert('Login successful!');"
            >

                <label for="username">
                    Username:
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">
                    Password:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="forgot">
                    <a href="#">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

        </section>

    </main>

    <footer
        style="text-align: center;
               margin-top: 40px;
               color: #d5cfcf;
               font-size: 14px;"
    >
        <p>&copy; 2026 Login Page</p>
    </footer>

</body>
</html>
